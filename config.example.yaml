# dns-client configuration (SPEC §8).
#
# Copy to the platform default path, or run `dns-client config init`:
#   Windows: %ProgramData%\dns-client\config.yaml
#   Linux:   ~/.config/dns-client/config.yaml (or $XDG_CONFIG_HOME)
#
# Precedence when starting: command-line flags > this file > built-in defaults.

schema_version: 1
mode: off          # on | off
profile: default   # which entry under profiles is active

# Optional service file logging.  Off by default.  Applies at the next service
# start (the GUI Logging page writes these).  See docs/CONFIG.md.
log:
  level: off          # off | error | info | debug
  path: ""            # empty = %ProgramData%\dns-client\dns-client.log
  max_size_mb: 10     # rotate when the file reaches this size
  keep_mb: 3          # after rotation keep the newest this many MB

profiles:
  default:
    # Quad9 "Secure" (malware blocking, DNSSEC-validating), dual-stack.
    upstreams:
      - https://dns.quad9.net/dns-query
    bootstrap:
      - 9.9.9.9
      - 149.112.112.112
      - "2620:fe::fe"
      - "2620:fe::9"

    # Optional display-only metadata (never used for resolution; older configs
    # omit it).  Lets a GUI label the profile without parsing the upstream URL.
    provider: Quad9
    variant: secure
    protocol: doh

    cache:
      enabled: true
      size_bytes: 67108864   # 64 MiB

    # Per-domain routing and blocklists (see docs/CONFIG.md).
    # Per-domain routing (dnsmasq-style).  Notes:
    #   - a domain matches itself and its subdomains; the most specific rule wins
    #   - "*.sub.example" matches subdomains only (not sub.example itself)
    #   - "" (empty) matches unqualified/single-label names only
    #   - upstream "#" excludes the domains, falling back to the default pool
    #   - DS queries for "secure.corp.example" are resolved via the parent zone
    #     ("corp.example"), i.e. the upstream of the delegation's parent
    per_domain:
      - domains: ["corp.example"]
        upstream: "tls://10.0.0.1"
      # - domains: ["*.internal.example"]
      #   upstream: "tls://10.0.0.2"
      # - domains: [""]
      #   upstream: "tls://10.0.0.3"
      # - domains: ["public.example"]
      #   upstream: "#"
    filtering:
      enabled: false
      lists: []
      block_response: 0.0.0.0    # 0.0.0.0 | nxdomain
      block_ttl: 3600
    # Filtering example (opt in; lists default disabled):
    # filtering:
    #   enabled: true
    #   block_response: 0.0.0.0
    #   block_ttl: 3600
    #   lists:
    #     - url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
    #       enabled: true
    #     - url: /path/to/local/hosts.txt
    #       enabled: true

  # ---------------------------------------------------------------------------
  # Example: NextDNS (requires your profile id).
  #
  # Ultralow (default, best routing): connect by hostname with NO bootstrap.
  #   dns-client providers show nextdns/ultralow/doh --id <id>
  # Anycast (bootstrap-pinned, avoids the system resolver; worse routing):
  #   dns-client providers show nextdns/anycast/doh --id <id>
  # ---------------------------------------------------------------------------
  # nextdns:
  #   upstreams:
  #     - https://dns.nextdns.io/<id>
  #   bootstrap: []          # ultralow: empty on purpose
  #   cache: { enabled: true, size_bytes: 67108864 }

  # ---------------------------------------------------------------------------
  # Example: ControlD custom profile (requires your id).
  #   dns-client providers show controld/custom/doh --id <id>
  #
  # ControlD free presets p0–p3 and named presets share bootstrap IPs:
  #   dns-client providers show controld/p1/doh
  # ---------------------------------------------------------------------------
  # controld:
  #   upstreams:
  #     - https://dns.controld.com/<id>
  #   bootstrap:
  #     - 76.76.2.22
  #     - 76.76.10.22
  #     - "2606:1a40::22"
  #     - "2606:1a40:1::22"
  #   cache: { enabled: true, size_bytes: 67108864 }
