name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Needed for creating the GitHub Release and uploading assets.
permissions:
  contents: write
  actions: read # CI gate below reads the CI run for the tagged commit

# Serialize runs for the same ref: a re-run for a tag queues behind the current
# one instead of interleaving. Different tags run independently.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # CI already ran vet+test for this commit (it is on a branch). Re-running
      # them here doubles the release time; fall back to running them only when
      # no push CI run exists for this SHA (e.g. a tag on an unmerged commit). A
      # red or still-running push run blocks the release: it must not publish.
      - name: Check CI is green for this commit
        id: ci
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = $env:GITHUB_SHA
          $raw = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=20"
          $exit = $LASTEXITCODE
          if ($exit -ne 0) {
            throw "Could not query ci.yml runs for $sha (gh exit $exit); refusing to release."
          }
          $json = $raw -join "`n" | ConvertFrom-Json
          if ($null -eq $json.workflow_runs) {
            throw "Unexpected ci.yml runs response for $sha; refusing to release."
          }
          # Only push runs count. A pull_request run for the same SHA can be the
          # newest and get cancelled by a later PR push; it must not block a
          # release, and an unmerged commit has no push run (documented fallback).
          $runs = @($json.workflow_runs | Where-Object { $_.event -eq 'push' })
          $completed = @($runs | Where-Object { $null -ne $_.conclusion })
          $latest = $completed | Select-Object -First 1
          if (-not $latest) {
            if ($runs.Count -gt 0) {
              throw "CI run(s) for $sha are still in progress; wait for one to finish, then re-run this release."
            }
            Write-Host "::warning::No push CI run exists for $sha; running vet/test in this job."
            "green=false" >> $env:GITHUB_OUTPUT
          }
          elseif ($latest.conclusion -ne 'success') {
            throw "CI for $sha concluded '$($latest.conclusion)' ($($latest.html_url)); refusing to release. Re-run CI first."
          }
          else {
            Write-Host "CI passed for ${sha}: $($latest.html_url)"
            "green=true" >> $env:GITHUB_OUTPUT
          }

      - name: Vet
        if: steps.ci.outputs.green != 'true'
        run: go vet ./...

      - name: Vet (gui)
        if: steps.ci.outputs.green != 'true'
        run: go vet -tags gui ./...

      - name: Test
        if: steps.ci.outputs.green != 'true'
        run: go test -timeout 120s ./...

      # GUI headless smoke test (software renderer; no GPU/display needed).
      - name: Test (gui)
        if: steps.ci.outputs.green != 'true'
        run: go test -tags gui -timeout 120s ./internal/gui/

      - name: Build (windows/amd64)
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $version = $env:GITHUB_REF_NAME
          if ($env:GITHUB_REF_TYPE -ne 'tag') { $version = "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          Write-Host "Building version $version"
          $stamp = "-X github.com/daika7ana/sigil-dns/internal/version.Version=$version"

          # Console subsystem: CLI + service host + headless --apply helper.
          # -s -w matches dev/build.sh: strip the symbol table and DWARF so the
          # release download stays small (Go runtime stack traces still work).
          go build -trimpath -ldflags "-s -w $stamp" -o dist/sigildns.exe ./cmd/sigildns
          # GUI subsystem: same program; no console window; opens the status
          # window with no arguments. Still --apply-capable for elevation.
          go build -trimpath -tags gui -ldflags "-s -w -H windowsgui $stamp" -o dist/sigildns-gui.exe ./cmd/sigildns

      - name: Sign (optional)
        id: sign
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          $pfxBase64 = $env:WINDOWS_CERT_PFX_BASE64
          $pfxPassword = $env:WINDOWS_CERT_PASSWORD
          $exes = @(
            (Join-Path $PWD 'dist/sigildns.exe')
            (Join-Path $PWD 'dist/sigildns-gui.exe')
          )

          if ([string]::IsNullOrWhiteSpace($pfxBase64) -or [string]::IsNullOrWhiteSpace($pfxPassword)) {
            Write-Host '::warning::Signing skipped: set WINDOWS_CERT_PFX_BASE64 and WINDOWS_CERT_PASSWORD repository secrets to sign releases.'
            exit 0
          }

          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) {
            throw 'signtool.exe not found under the Windows 10/11 SDK.'
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($pfxBase64))
          try {
            foreach ($exe in $exes) {
              & $signtool.FullName sign /fd SHA256 /td SHA256 /tr 'http://timestamp.digicert.com' /f $pfxPath /p $pfxPassword $exe
              if ($LASTEXITCODE -ne 0) { throw "signtool sign failed ($LASTEXITCODE) for $exe" }

              & $signtool.FullName verify /pa $exe
              if ($LASTEXITCODE -ne 0) { throw "signtool verify failed ($LASTEXITCODE) for $exe" }

              Write-Host "Signed $exe"
            }
          }
          finally {
            Remove-Item -Force $pfxPath -ErrorAction SilentlyContinue
          }

          "signed=true" >> $env:GITHUB_OUTPUT

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $version = $env:GITHUB_REF_NAME
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            $version = "dev-$($env:GITHUB_SHA.Substring(0, 7))"
          }
          Write-Host "Packaging version $version"

          $stage = Join-Path $env:RUNNER_TEMP 'sigildns-stage'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item 'dist/sigildns.exe'        $stage -Force
          Copy-Item 'dist/sigildns-gui.exe'    $stage -Force
          Copy-Item 'install.ps1'                $stage -Force
          Copy-Item 'config.example.yaml'        $stage -Force
          Copy-Item 'README.md'                  $stage -Force
          Copy-Item 'SPEC.md'                    $stage -Force
          Copy-Item 'CHANGELOG.md'               $stage -Force
          Copy-Item 'LICENSE'                    $stage -Force
          Copy-Item 'docs'                       $stage -Recurse -Force

          $zip = "dist/sigildns_${version}_windows_amd64.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          Write-Host "Created $zip"

          # The zip itself is unsigned; the hash is all a downloader can check.
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          "$hash  $(Split-Path -Leaf $zip)" | Set-Content -Encoding ascii 'dist/SHA256SUMS.txt'
          Write-Host "Created dist/SHA256SUMS.txt"

      - name: Verify package
        shell: pwsh
        env:
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          $ErrorActionPreference = 'Stop'

          $zip = (Get-ChildItem -Path dist -Filter '*.zip' | Select-Object -First 1).FullName
          $out = Join-Path $env:RUNNER_TEMP 'verify'
          Expand-Archive -Path $zip -DestinationPath $out -Force

          $expected = @(
            'sigildns.exe'
            'sigildns-gui.exe'
            'install.ps1'
            'config.example.yaml'
            'README.md'
            'SPEC.md'
            'CHANGELOG.md'
            'LICENSE'
            'docs/CONFIG.md'
            'docs/GUI.md'
            'docs/LIMITATIONS.md'
            'docs/RELEASE.md'
            'docs/TROUBLESHOOTING.md'
          )
          foreach ($rel in $expected) {
            if (-not (Test-Path (Join-Path $out $rel))) {
              throw "$rel missing from $(Split-Path -Leaf $zip)"
            }
          }
          Write-Host "Package contains all $($expected.Count) expected files"

          $sumLine = (Get-Content 'dist/SHA256SUMS.txt' -Raw).Trim()
          $expectedHash = ($sumLine -split '\s+')[0]
          $actualHash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          if ($actualHash -ne $expectedHash) {
            throw "SHA256SUMS.txt does not match $(Split-Path -Leaf $zip)"
          }
          Write-Host "SHA256SUMS.txt matches $(Split-Path -Leaf $zip)"

          $exes = @('sigildns.exe', 'sigildns-gui.exe') | ForEach-Object { Join-Path $out $_ }

          # Catch a silently skipped sign step before the assets are published.
          if ($env:SIGNED -eq 'true') {
            foreach ($exe in $exes) {
              $sig = Get-AuthenticodeSignature $exe
              if ($sig.Status -ne 'Valid') { throw "unsigned or invalid signature on $exe ($($sig.Status))" }
            }
            Write-Host 'Authenticode signatures verified'
          }

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sigildns-windows-amd64
          overwrite: true
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          $tag = $env:GITHUB_REF_NAME
          $zip = (Get-ChildItem -Path dist -Filter '*.zip' | Select-Object -First 1).FullName
          $sums = (Resolve-Path 'dist/SHA256SUMS.txt').Path

          # Draft first: a failed run must never leave a public release with no assets.
          # Notes: a curated release-notes/<tag>.md wins, then the matching
          # CHANGELOG.md section, then GitHub's generated notes.
          $notesArgs = @('--generate-notes')
          if (Test-Path "release-notes/$tag.md") {
            $notesArgs = @('--notes-file', "release-notes/$tag.md")
          } elseif (Test-Path 'CHANGELOG.md') {
            $version = $tag.TrimStart('v')
            $lines = @(Get-Content 'CHANGELOG.md')
            $heading = '^##\s+\[' + [regex]::Escape($version) + '\]'
            $start = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match $heading) { $start = $i; break }
            }
            if ($start -ge 0) {
              $end = $lines.Count
              for ($j = $start + 1; $j -lt $lines.Count; $j++) {
                if ($lines[$j] -match '^##\s+') { $end = $j; break }
              }
              $bodyLines = @()
              if ($end -gt $start + 1) { $bodyLines = $lines[($start + 1)..($end - 1)] }
              $body = ($bodyLines -join "`n").Trim()
              if ($body) {
                $notesFile = Join-Path $env:RUNNER_TEMP "release-notes-$tag.md"
                Set-Content -Path $notesFile -Value $body -Encoding utf8
                $notesArgs = @('--notes-file', $notesFile)
              } else {
                Write-Host "CHANGELOG.md section $version is empty; using generated notes."
              }
            } else {
              Write-Host "No CHANGELOG.md section for $version; using generated notes."
            }
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --title $tag @notesArgs
            if ($LASTEXITCODE -ne 0) {
              Write-Host 'Release already exists (draft from a previous run); reusing it.'
            }
          }

          gh release upload $tag $zip $sums --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed ($LASTEXITCODE)" }

          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw "gh release publish failed ($LASTEXITCODE)" }
