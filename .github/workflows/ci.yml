name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go build -tags tray ./...
      - run: go build -tags gui ./...
      - run: go vet ./...
      - run: go vet -tags gui ./...
      - run: go test -timeout 120s ./...
      # GUI headless smoke test (software renderer; no GPU/display needed).  Run
      # on both runners: Linux for fast feedback, Windows for the real target.
      - run: go test -tags gui ./internal/gui/

  integration-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build CLI
        run: go build -o sigildns.exe ./cmd/sigildns
      - name: NRPT integration test
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/ci-windows-integration.ps1
