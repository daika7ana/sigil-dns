version: 2
updates:
  # Workflow actions are pinned to commit SHAs (release.yml holds
  # contents: write and the signing secrets).  Dependabot keeps those SHAs
  # current with a reviewed PR instead of a mutable tag.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Go modules: gets update PRs for the rest of go.mod.  go-winio is pinned
  # deliberately (upgrading it has dragged a golang.org/x/* cascade before), so
  # its bump stays a manual decision.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: github.com/Microsoft/go-winio
